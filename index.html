<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF14 時尚品鑑記錄</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <h1>✦ FF XIV 時尚品鑑記錄 ✦</h1>
  <div id="authBar" class="auth-bar">
    <span id="authStatus" class="auth-status">未登入（資料僅存在本機）</span>
    <button id="btnSignIn" class="btn-auth" onclick="FashionCloud.signIn()">🔑 使用 Google 登入以雲端同步</button>
    <button id="btnSignOut" class="btn-auth" style="display:none" onclick="FashionCloud.signOut()">登出</button>
  </div>
</header>

<div class="transfer-toast" id="toast"></div>

<div class="layout">

  <!-- ── 左欄 ── -->
  <div style="display:flex;flex-direction:column;gap:16px;">

  <div class="panel">
    <div class="panel-header">✏️ &nbsp;新增本週記錄</div>
    <div class="panel-body">

      <div class="form-group">
        <label>📅 日期</label>
        <input type="date" id="frDate">
      </div>

      <div class="form-group">
        <label>🎨 本週主題</label>
        <textarea id="frTheme"></textarea>
      </div>

      <div class="form-group">
        <label>🏆 得分</label>
        <select id="frScore">
          <option value="80">80 分</option>
          <option value="100">100 分</option>
          <option value="other">其他</option>
        </select>
      </div>

      <div class="form-group">
        <label>📋 作業說明</label>
        <textarea id="frDesc"></textarea>
      </div>

      <hr class="form-divider">

      <div class="slot-col-header">
        <span></span>
        <span>裝備名稱</span>
        <span>取得方式</span>
        <span></span>
      </div>

      <div id="slotsForm"></div>

      <hr class="form-divider">

      <div class="form-group">
        <label>📝 備註</label>
        <textarea id="frNote"></textarea>
      </div>

      <button class="btn-submit" onclick="addRecord()">＋ 新增記錄</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header transfer-header">💾 &nbsp;資料轉移</div>
    <div class="panel-body" style="display:flex;flex-direction:column;gap:10px;">
      <p style="font-size:0.75rem;color:#5a7aaa;line-height:1.6;margin:0;">
        登入後資料會自動同步到雲端；匯出/匯入 JSON 檔案可用於備份或離線轉移。
      </p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn-export" onclick="exportData()">📤 匯出資料</button>
        <button class="btn-import" onclick="document.getElementById('importFile').click()">📥 匯入資料</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
      </div>
      <div id="syncStatus" class="sync-status"></div>
    </div>
  </div>

  </div>

  <!-- ── 右欄 ── -->
  <div class="panel">
    <div class="panel-header">📋 &nbsp;歷週記錄</div>
    <div class="panel-body">
      <div id="recordList"></div>
    </div>
  </div>

</div>

<script type="module" src="js/firebase-sync.js"></script>
<script src="js/app.js"></script>
</body>
</html>
